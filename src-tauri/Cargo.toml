[package]
name = "orbshare"
version = "0.1.0"
edition = "2021"

[lib]
name = "orbshare_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
orb-core = { path = "../crates/orb-core" }
orb-signaling = { path = "../crates/orb-signaling" }
orb-discovery = { path = "../crates/orb-discovery" }
orb-webrtc = { path = "../crates/orb-webrtc" }
webrtc = "0.11"
orb-capture = { path = "../crates/orb-capture" }
orb-policy = { path = "../crates/orb-policy" }
orb-encoder = { path = "../crates/orb-encoder" }
orb-media = { path = "../crates/orb-media" }
local-ip-address = "0.6"
hostname = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "std"] }
base64 = "0.22"
